<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient: Brand Coral to UI Blue -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9b8a" />
      <stop offset="45%" stop-color="#eb7d66" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Drop shadow for the central symbol -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0b132b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Subtle inner border ring -->
  <rect x="12" y="12" width="488" height="488" rx="116" stroke="white" stroke-opacity="0.15" stroke-width="6" />

  <!-- Minimalist Conversion Symbol -->
  <g filter="url(#shadow)">
    <!-- Connecting Curve (Vector to Pixel path) -->
    <path d="M 150 340 C 150 200, 362 312, 362 172" stroke="white" stroke-width="48" stroke-linecap="round" />

    <!-- Vector Node (Circle) on the left -->
    <circle cx="150" cy="340" r="48" fill="white" />
    <circle cx="150" cy="340" r="20" fill="#eb7d66" />

    <!-- Raster Pixel (Square) on the right -->
    <rect x="314" y="124" width="96" height="96" rx="24" fill="white" />
    <rect x="338" y="148" width="48" height="48" rx="10" fill="#2563eb" />
  </g>
</svg>